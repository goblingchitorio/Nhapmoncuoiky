    function App() {
      const [hotspots, setHotspots] = useState(INITIAL_HOTSPOTS);
      const [selectedHotspot, setSelectedHotspot] = useState(null);
      const [volunteerModalHotspot, setVolunteerModalHotspot] = useState(null);
      const [activityModalHotspot, setActivityModalHotspot] = useState(null);
      const [filterSeverity, setFilterSeverity] = useState('all');
      const [solutionTab, setSolutionTab] = useState('individual');
      const [teamView, setTeamView] = useState('grid');
      const [sliderPos, setSliderPos] = useState(50);

      // Form state
      const [formTitle, setFormTitle] = useState('');
      const [formLocation, setFormLocation] = useState('Quận 1, TP. Hồ Chí Minh');
      const [formLat, setFormLat] = useState(10.7769);
      const [formLng, setFormLng] = useState(106.7009);
      const [formSeverity, setFormSeverity] = useState('critical');
      const [formScale, setFormScale] = useState('Điểm đen tự phát lớn');
      const [formDesc, setFormDesc] = useState('');
      const [showToast, setShowToast] = useState(false);

      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);

      // Khởi tạo Leaflet Map
      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (mapInstanceRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: [15.8, 107.5],
          zoom: 6,
          minZoom: 4,
          maxZoom: 18
        });

        // Ultra-reliable Fastly CDN tiles (100% stable, never drops or flickers)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors &copy; CARTO',
          subdomains: 'abcd',
          maxZoom: 20
        }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);
        markersLayerRef.current = markersGroup;
        mapInstanceRef.current = map;

        map.on('click', (e) => {
          const lat = parseFloat(e.latlng.lat.toFixed(5));
          const lng = parseFloat(e.latlng.lng.toFixed(5));
          setFormLat(lat);
          setFormLng(lng);
          setFormLocation(`Tọa độ: ${lat}, ${lng}`);
        });

        setTimeout(() => map.invalidateSize(), 150);
        setTimeout(() => map.invalidateSize(), 500);

        let observer = null;
        if (mapContainerRef.current && 'IntersectionObserver' in window) {
          observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                map.invalidateSize();
                setTimeout(() => map.invalidateSize(), 200);
              }
            });
          }, { threshold: 0.1 });
          observer.observe(mapContainerRef.current);
        }

        return () => {
          if (observer) observer.disconnect();
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      // Cập nhật Markers trên Map
      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerRef.current) return;
        const markersGroup = markersLayerRef.current;
        markersGroup.clearLayers();

        const filtered = filterSeverity === 'all'
          ? hotspots
          : hotspots.filter(h => h.severity === filterSeverity);

        filtered.forEach(h => {
          const color = h.severity === 'critical' ? '#ef4444' : h.severity === 'moderate' ? '#f59e0b' : '#10b981';
          const icon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div style="background-color: ${color}; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 0 10px ${color}; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold;">
                ${h.severity === 'critical' ? '🔴' : h.severity === 'moderate' ? '🟡' : '🟢'}
              </div>
            `,
            iconSize: [22, 22],
            iconAnchor: [11, 11]
          });

          const marker = L.marker([h.lat, h.lng], { icon }).addTo(markersGroup);
          marker.bindPopup(`
            <div style="max-width: 220px; font-family: inherit;">
              <strong style="color: #fff; font-size: 13px;">${h.title}</strong>
              <div style="color: #a1a1aa; font-size: 11px; margin: 2px 0;">📍 ${h.locationName}</div>
              <p style="color: #d4d4d8; font-size: 11px; margin: 4px 0;">${h.description.slice(0, 70)}...</p>
              <a href="https://www.openstreetmap.org/?mlat=${h.lat}&mlon=${h.lng}#map=16/${h.lat}/${h.lng}" target="_blank" style="color: #34d399; font-size: 11px; font-weight: bold; text-decoration: underline;">
                🗺️ Mở OpenStreetMap ↗
              </a>
            </div>
          `);

          marker.on('click', () => setSelectedHotspot(h));
        });
      }, [hotspots, filterSeverity]);

      const panToHotspot = (h) => {
        setSelectedHotspot(h);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo([h.lat, h.lng], 13);
        }
      };

      const handleToggleUpvote = (id) => {
        setHotspots(prev => prev.map(h => {
          if (h.id === id) {
            const up = !h.hasUpvoted;
            return { ...h, hasUpvoted: up, upvotes: up ? h.upvotes + 1 : h.upvotes - 1 };
          }
          return h;
        }));
      };

      const handleSubmitReport = (e) => {
        e.preventDefault();
        if (!formTitle.trim() || !formLocation.trim()) {
          alert('Vui lòng điền đầy đủ tên điểm rác và vị trí!');
          return;
        }

        const newH = {
          id: `hs-${Date.now()}`,
          title: formTitle,
          locationName: formLocation,
          lat: formLat,
          lng: formLng,
          severity: formSeverity,
          description: `${formDesc || 'Báo cáo điểm rác mới từ cộng đồng'} (Quy mô: ${formScale})`,
          imageUrl: 'https://images.unsplash.com/photo-1618477461853-cf6ed80faba5?auto=format&fit=crop&w=700&q=80',
          reportedAt: 'Vừa xong',
          reportedBy: 'Người dân địa phương',
          upvotes: 1,
          hasUpvoted: true,
          volunteersNeeded: 20,
          volunteersJoined: 1,
          statusText: 'Đã tiếp nhận báo cáo · Chờ duyệt ra quân',
          cleanupDetails: {
            eventDate: 'Dự kiến vào cuối tuần tới (07:30 - 11:30)',
            meetingPoint: formLocation,
            coordinatorName: 'Nguyễn Ngọc Như Ý (Field Coordinator GENGREEN)',
            coordinatorContact: '0934.567.890 / Zalo: GENGREEN Vietnam',
            targetWaste: 'Dự kiến thu gom ~2.5 tấn rác nhựa và bao bì nilon',
            requiredGear: ['Găng tay bảo hộ', 'Ủng cao su', 'Kẹp gắp rác dài 1m'],
            schedule: ['07:30: Tập trung', '08:00 - 10:30: Thu gom và phân loại rác', '11:00: Bàn giao xe ép'],
            sponsorsOrPartners: 'GENGREEN & Đoàn Thanh niên địa phương'
          }
        };

        setHotspots(prev => [newH, ...prev]);
        setSelectedHotspot(newH);
        setShowToast(true);

        // Gửi thông tin về email 26162120@student.hcmute.edu.vn
        try {
          fetch(`https://formsubmit.co/ajax/${TARGET_EMAIL}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              _subject: `[GENGREEN] Báo cáo điểm rác mới: ${formTitle}`,
              'Tên điểm rác': formTitle,
              'Vị trí': formLocation,
              'Tọa độ GPS': `${formLat}, ${formLng}`,
              'Mức độ': formSeverity === 'critical' ? '🔴 Điểm đen lớn' : '🟡 Trung bình',
              'Quy mô': formScale,
              'Mô tả': formDesc,
              'Email tiếp nhận': TARGET_EMAIL
            })
          }).catch(() => {});
        } catch (e) {}

        setFormTitle('');

                    <span className="text-zinc-400 block text-[11px] mt-0.5">Hotline: {activityModalHotspot.cleanupDetails?.coordinatorContact}</span>
                  </div>
                  <div className="p-3 rounded-xl bg-zinc-950 border border-zinc-800">
                    <span className="text-zinc-400 block font-semibold mb-0.5">🎯 Mục tiêu thu gom:</span>
                    <span className="text-zinc-200">{activityModalHotspot.cleanupDetails?.targetWaste}</span>
                  </div>
                </div>

                <div className="flex items-center justify-between gap-3 pt-3 border-t border-zinc-800">
                  <a
                    href={`https://www.openstreetmap.org/?mlat=${activityModalHotspot.lat}&mlon=${activityModalHotspot.lng}#map=16/${activityModalHotspot.lat}/${activityModalHotspot.lng}`}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-800 text-zinc-200 hover:text-white border border-zinc-700"
                  >
                    Mở OpenStreetMap
                  </a>
                  <button
                    onClick={() => {
                      const h = activityModalHotspot;
                      setActivityModalHotspot(null);
                      setVolunteerModalHotspot(h);
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 shadow"
                  >
                    Đăng ký tham gia dọn dẹp
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODAL ĐĂNG KÝ TÌNH NGUYỆN VIÊN (GỬI VỀ EMAIL TARGET_EMAIL) */}
          {/* ============================================================== */}
          {volunteerModalHotspot && (
            <VolunteerFormModal
              hotspot={volunteerModalHotspot}
              onClose={() => setVolunteerModalHotspot(null)}
              onSuccess={(formData) => {
                setHotspots(prev => prev.map(h => h.id === volunteerModalHotspot.id ? { ...h, volunteersJoined: h.volunteersJoined + 1 } : h));
              }}
            />
          )}
        </div>
      );
    }

    // ==============================================================
    // COMPONENT: VOLUNTEER FORM MODAL (TỰ ĐỘNG GỬI VỀ EMAIL)
    // ==============================================================
    function VolunteerFormModal({ hotspot, onClose, onSuccess }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [email, setEmail] = useState('');
      const [date, setDate] = useState('2026-10-18');
      const [notes, setNotes] = useState('');
      const [isSending, setIsSending] = useState(false);
      const [isDone, setIsDone] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim() || !phone.trim()) return;

        setIsSending(true);

        const payload = {
          _subject: `[GENGREEN] Đăng ký tham gia dọn dẹp: ${hotspot.title}`,
          'Họ và tên': name,
          'Số điện thoại / Zalo': phone,
          'Email': email || 'Không có',
          'Điểm rác đăng ký': `${hotspot.title} (${hotspot.locationName})`,
          'Tọa độ': `${hotspot.lat}, ${hotspot.lng}`,
          'Ngày tham gia': date,
          'Ghi chú': notes || 'Không có',
          'Thời gian đăng ký': new Date().toLocaleString('vi-VN'),
          'Email tiếp nhận': TARGET_EMAIL
        };

        try {
          await fetch(`https://formsubmit.co/ajax/${TARGET_EMAIL}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.warn('FormSubmit:', err);
        }

        setIsSending(false);
        setIsDone(true);
        onSuccess({ name, phone, email, date, notes });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
          <div className="absolute inset-0" onClick={onClose} />
          <div className="relative z-10 max-w-lg w-full bg-zinc-900 border border-emerald-500/50 rounded-2xl p-6 sm:p-7 shadow-2xl">
            <button onClick={onClose} className="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg font-bold">✕</button>

            {isDone ? (
              <div className="text-center py-6 animate-fadeIn">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-3 border border-emerald-500/40 text-2xl font-bold">
                  ✓
                </div>
                <h3 className="text-xl font-bold text-white mb-2">Đăng Ký Thành Công!</h3>
                <div className="p-3.5 rounded-xl bg-emerald-950/70 border border-emerald-500/40 text-xs text-emerald-200 mb-5">
                  <p className="font-semibold mb-1">Thông tin đã được gửi trực tiếp đến email ban điều phối:</p>
                  <p className="font-mono font-bold text-white text-sm bg-zinc-950 py-1 px-2 rounded border border-emerald-500/30 inline-block">
                    {TARGET_EMAIL}
                  </p>
                  <p className="text-[11px] text-zinc-300 mt-2">
                    Đội trưởng tình nguyện viên sẽ liên hệ với bạn qua SĐT/Zalo <strong>{phone}</strong> trong 24 giờ tới.
                  </p>
                </div>
                <button
                  onClick={onClose}
                  className="px-6 py-2 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-zinc-950"
                >
                  Hoàn tất
                </button>
              </div>
            ) : (
              <div>
                <h3 className="text-lg font-bold text-white mb-1">Đăng Ký Tham Gia Dọn Dẹp</h3>
                <p className="text-xs text-emerald-400 font-semibold mb-3">{hotspot.title}</p>

                <div className="p-2.5 rounded-xl bg-emerald-950/50 border border-emerald-500/30 text-[11px] text-emerald-300 mb-4">
                  📧 Thông tin đăng ký sẽ được tự động gửi về email: <strong>{TARGET_EMAIL}</strong>
                </div>

                <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-zinc-300 font-semibold mb-1">Họ và tên của bạn *</label>
                    <input
                      type="text"
                      required
                      placeholder="Ví dụ: Nguyễn Văn An"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-zinc-300 font-semibold mb-1">Số điện thoại / Zalo *</label>
                      <input
                        type="tel"
                        required
                        placeholder="0912 345 678"
                        value={phone}
                        onChange={(e) => setPhone(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="block text-zinc-300 font-semibold mb-1">Địa chỉ Email</label>
                      <input
                        type="email"
                        placeholder="ban@gmail.com"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-zinc-300 font-semibold mb-1">Thời gian có thể tham gia</label>
                    <input
                      type="date"
                      value={date}
                      onChange={(e) => setDate(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="block text-zinc-300 font-semibold mb-1">Ghi chú thêm (dụng cụ mang theo...)</label>
                    <textarea
                      rows="2"
                      placeholder="Ủng lội nước, kẹp rác hoặc xe máy hỗ trợ..."
                      value={notes}
                      onChange={(e) => setNotes(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-700 text-white focus:outline-none focus:border-emerald-500 resize-none"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={onClose}
                      disabled={isSending}
                      className="px-4 py-2 rounded-xl text-zinc-400 hover:text-white"
                    >
                      Hủy
                    </button>
                    <button
                      type="submit"
                      disabled={isSending}
                      className="px-5 py-2 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 shadow transition disabled:opacity-50"
                    >
                      {isSending ? 'Đang gửi đến email...' : 'Xác nhận & Gửi về Email'}
                    </button>
                  </div>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
